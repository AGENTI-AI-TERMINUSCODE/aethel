<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aethel Sovereign Sidebar</title>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif; background: #09090b; color: #f4f4f5; display: flex; flex-direction: column; height: 100vh; }
    header { padding: 12px 14px; border-bottom: 1px solid #27272a; display: flex; align-items: center; justify-content: space-between; }
    header h1 { margin: 0; font-size: 14px; letter-spacing: 0.04em; }
    header span { font-size: 10px; color: #22d3ee; font-family: monospace; }
    #messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .msg { padding: 10px 12px; border-radius: 12px; font-size: 13px; line-height: 1.5; white-space: pre-wrap; }
    .user { background: #27272a; align-self: flex-end; max-width: 88%; }
    .assistant { background: #141418; border: 1px solid #27272a; align-self: flex-start; max-width: 96%; }
    .toolbar { padding: 8px 12px; border-top: 1px solid #27272a; display: flex; gap: 6px; }
    button.pill { background: #18181b; color: #e4e4e7; border: 1px solid #3f3f46; border-radius: 999px; padding: 5px 10px; font-size: 11px; cursor: pointer; }
    button.pill:hover { border-color: #22d3ee; color: #67e8f9; }
    form { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid #27272a; }
    input { flex: 1; background: #18181b; color: #fff; border: 1px solid #3f3f46; border-radius: 10px; padding: 8px 10px; font-size: 13px; outline: none; }
    button.send { background: #fff; color: #000; border: none; border-radius: 10px; padding: 0 14px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>AETHEL</h1>
      <span>Sovereign AI · TerminusCode</span>
    </div>
    <a href="https://aethel.terminuscode.com/it/" target="_blank" style="color:#a1a1aa;font-size:11px;text-decoration:none;">Apri Studio ↗</a>
  </header>
  <div id="messages">
    <div class="msg assistant">Ciao! Sono Aethel. Chiedimi qualsiasi cosa oppure clicca "Analizza pagina attiva" per sintetizzare la scheda che stai leggendo.</div>
  </div>
  <div class="toolbar">
    <button class="pill" id="btnSummarize">📄 Analizza pagina attiva</button>
  </div>
  <form id="chatForm">
    <input id="promptInput" type="text" placeholder="Chiedi ad Aethel..." autocomplete="off" />
    <button class="send" type="submit">↑</button>
  </form>
  <script src="sidepanel.js"></script>
</body>
</html>
